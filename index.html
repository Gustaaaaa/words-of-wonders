<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Word Bloom</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Word Bloom: palavras cruzadas relaxantes em português. Deslize pelas letras e veja as palavras florescerem.">
  <meta name="theme-color" content="#9cc7e3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Word Bloom">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Cenário: céu (dois planos para trocar de capítulo com fade), sol/lua, nuvens,
       estrelas e três camadas de colinas que se mexem em parallax -->
  <div id="bg" aria-hidden="true">
    <div class="bg-layer" id="bgA"></div>
    <div class="bg-layer" id="bgB"></div>
    <div class="stars px" data-depth="0.08" id="stars"></div>
    <div class="sun-wrap px" data-depth="0.15"><div class="sun"></div></div>
    <div class="clouds px" data-depth="0.3">
      <svg class="cloud c1" viewBox="0 0 120 50"><path d="M20 44h82a16 16 0 0 0 0-32 22 22 0 0 0-40-6A18 18 0 0 0 30 22a12 12 0 0 0-10 22Z"/></svg>
      <svg class="cloud c2" viewBox="0 0 120 50"><path d="M20 44h82a16 16 0 0 0 0-32 22 22 0 0 0-40-6A18 18 0 0 0 30 22a12 12 0 0 0-10 22Z"/></svg>
      <svg class="cloud c3" viewBox="0 0 120 50"><path d="M20 44h82a16 16 0 0 0 0-32 22 22 0 0 0-40-6A18 18 0 0 0 30 22a12 12 0 0 0-10 22Z"/></svg>
    </div>
    <div id="ambient"></div>
    <svg class="hills hills-far px" data-depth="0.45" viewBox="0 0 400 200" preserveAspectRatio="none">
      <path d="M-20 90 C 30 40, 80 30, 130 70 S 210 20, 270 55 S 360 30, 420 70 L420 200 L-20 200Z"/>
    </svg>
    <svg class="hills hills-mid px" data-depth="0.7" viewBox="0 0 400 200" preserveAspectRatio="none">
      <path d="M-20 110 C 50 60, 120 70, 180 100 S 300 50, 420 95 L420 200 L-20 200Z"/>
    </svg>
    <svg class="hills hills-near px" data-depth="1" viewBox="0 0 400 200" preserveAspectRatio="none">
      <path d="M-20 130 C 70 95, 150 105, 230 125 S 350 95, 420 115 L420 200 L-20 200Z"/>
    </svg>
  </div>

  <div id="app">
    <!-- ======================= INÍCIO ======================= -->
    <section class="screen" id="home" hidden>
      <header class="topbar">
        <button class="icon-btn glass" id="btnSettings" aria-label="Configurações">
          <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </button>
        <div class="coins glass" data-coins><span class="coin-ico"></span><b>0</b></div>
      </header>

      <div class="home-body">
        <div class="logo">
          <div class="logo-mark" aria-hidden="true">
            <span>W</span><span>O</span><span>R</span><span>D</span>
          </div>
          <div class="logo-bloom" aria-hidden="true">
            <svg class="flower" viewBox="0 0 40 40"><g><ellipse cx="20" cy="9" rx="6.5" ry="9"/><ellipse cx="20" cy="9" rx="6.5" ry="9" transform="rotate(72 20 20)"/><ellipse cx="20" cy="9" rx="6.5" ry="9" transform="rotate(144 20 20)"/><ellipse cx="20" cy="9" rx="6.5" ry="9" transform="rotate(216 20 20)"/><ellipse cx="20" cy="9" rx="6.5" ry="9" transform="rotate(288 20 20)"/></g><circle cx="20" cy="20" r="5.5"/></svg>
            <span>bloom</span>
          </div>
          <h1 class="sr-only">Word Bloom</h1>
          <p class="tagline">palavras que florescem</p>
        </div>

        <div class="card glass chapter-card">
          <div class="chapter-top">
            <div class="chapter-info">
              <small id="homeChapterLabel">Capítulo 1</small>
              <h2 id="homeChapterName">Amanhecer</h2>
            </div>
            <div class="chapter-ring" aria-label="Progresso no capítulo">
              <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20"/><circle class="ring-fill" id="homeRing" cx="24" cy="24" r="20"/></svg>
              <b id="homeLevelBadge">1</b>
            </div>
          </div>
          <div class="progress"><i id="homeChapterProgress"></i></div>
          <button class="btn primary big" id="btnPlay">
            <span class="play-row"><svg class="play-ico" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.4-6.5a1 1 0 0 0 0-1.7L9.5 4.6A1 1 0 0 0 8 5.5Z"/></svg>Jogar</span>
            <small id="btnPlayLevel">Nível 1</small>
          </button>
        </div>

        <div class="card glass daily-card" id="dailyCard">
          <div class="daily-top">
            <div class="cal" aria-hidden="true"><small id="calMonth">NOV</small><b id="calDay">8</b></div>
            <div class="daily-info">
              <small>Desafio do dia</small>
              <h3 id="dailyDate">—</h3>
            </div>
            <div class="streak" id="streakBadge" title="Dias seguidos">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5Z"/></svg>
              <b id="streakCount">0</b>
            </div>
          </div>
          <div class="week" id="weekDots"></div>
          <button class="btn soft" id="btnDaily">Jogar desafio</button>
        </div>
      </div>
    </section>

    <!-- ======================= JOGO ======================= -->
    <section class="screen" id="game" hidden>
      <header class="topbar">
        <button class="icon-btn glass" id="btnBack" aria-label="Voltar">
          <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <div class="level-title">
          <small id="gameChapter">Amanhecer</small>
          <b id="gameLevel">Nível 1</b>
        </div>
        <div class="coins glass" data-coins><span class="coin-ico"></span><b>0</b></div>
      </header>

      <div class="grid-wrap" id="gridWrap">
        <div class="grid" id="grid"></div>
      </div>

      <div class="mid">
        <div class="combo" id="combo" aria-live="polite">
          <span class="combo-x">x<b id="comboX">2</b></span>
          <span class="combo-label">combo</span>
          <span class="combo-bar"><i id="comboBar"></i></span>
        </div>
        <div class="preview" id="preview"></div>
      </div>

      <div class="play">
        <div class="side side-left">
          <button class="tool glass jar" id="btnJar" aria-label="Pote de palavras bônus">
            <svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16"/><circle class="ring-fill" id="jarRing" cx="18" cy="18" r="16"/></svg>
            <svg class="jar-ico" viewBox="0 0 24 24"><path d="M8 3h8"/><path d="M9 3v3L6.5 9A4 4 0 0 0 6 11v7a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3v-7a4 4 0 0 0-.5-2L15 6V3"/><path d="M8.5 13.5c1.2 1 2.4 1 3.5 0s2.3-1 3.5 0"/></svg>
            <span class="tool-badge" id="jarCount">0</span>
          </button>
        </div>

        <div class="wheel" id="wheel">
          <div class="wheel-disc glass"></div>
          <button class="wheel-center" id="btnShuffle" aria-label="Embaralhar letras" tabindex="-1">
            <svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
          </button>
          <svg class="wheel-lines" id="wheelLines"><polyline id="wheelLine" points=""/></svg>
          <div class="wheel-tip" id="wheelTip" hidden>Deslize o dedo pelas letras<br>para formar palavras</div>
        </div>

        <div class="side side-right">
          <button class="tool glass" id="hintLight" aria-label="Luz: revela uma letra">
            <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2l.1.2h4.8l.1-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3Z"/></svg>
            <span class="price" data-price="light">25</span>
          </button>
          <button class="tool glass" id="hintTarget" aria-label="Alvo: escolha uma casa para revelar">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6"/></svg>
            <span class="price" data-price="target">45</span>
          </button>
          <button class="tool glass" id="hintWind" aria-label="Vento: revela cinco letras">
            <svg viewBox="0 0 24 24"><path d="M3 8h10a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg>
            <span class="price" data-price="wind">80</span>
          </button>
        </div>
      </div>
    </section>
  </div>

  <div id="fxBack" aria-hidden="true"></div>
  <!-- camada de efeitos (letras voando, moedas, textos flutuantes) -->
  <div id="fx" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- ======================= MODAIS ======================= -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card glass-strong" id="modalCard"></div>
  </div>

  <div class="chapter-splash" id="chapterSplash" hidden>
    <small>Novo capítulo</small>
    <h2 id="splashName"></h2>
    <p id="splashQuote"></p>
  </div>

  <div class="loading" id="loading">
    <div class="loading-logo" aria-hidden="true">
      <span>W</span><span>O</span><span>R</span><span>D</span>
    </div>
    <div class="loading-bloom">bloom</div>
    <div class="loading-bar"><i id="loadingBar"></i></div>
    <p class="loading-text" id="loadingText">regando as palavras…</p>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
